name: CI - API Médica Lacrei

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: api_medica_db
          POSTGRES_USER: user_lacrei
          POSTGRES_PASSWORD: lacre_pass  # Alinhado com o que o seu Django está pedindo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov flake8 blue bleach python-dotenv

      - name: Run Tests and Coverage
        env:
          # Estas variáveis forçam o Django a ignorar arquivos locais durante o teste no GitHub
          DB_NAME: api_medica_db
          DB_USER: user_lacrei
          DB_PASSWORD: lacre_pass      # Senha igual ao serviço acima
          DB_HOST: localhost
          DB_PORT: 5432
          DATABASE_URL: postgres://user_lacrei:lacre_pass@localhost:5432/api_medica_db
          SECRET_KEY: test_secret_key
          DEBUG: "True"
        run: |
          pytest --cov=users --cov-report=xml