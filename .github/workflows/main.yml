name: CI/CD - API Médica Lacrei

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: api_medica_db
          POSTGRES_USER: user_lacrei
          POSTGRES_PASSWORD: lacre_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov blue bleach python-dotenv
          pip install "flake8>=7.0.0" "importlib-metadata>=7.0.0"

      - name: Lint with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=150 --statistics

      - name: Run Tests and Coverage
        env:
          DB_NAME: api_medica_db
          DB_USER: user_lacrei
          DB_PASSWORD: lacre_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DATABASE_URL: postgres://user_lacrei:lacre_pass@localhost:5432/api_medica_db
          SECRET_KEY: test_secret_key
          DEBUG: "True"
        run: |
          pytest --cov=users --cov-report=xml --cov-report=term

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    # Executa apenas se for push na main ou master (ajuste conforme sua branch principal)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-medica-lacrei:latest

  deploy-render:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: |
          # O Render atualizará a imagem automaticamente ao receber esse POST
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
