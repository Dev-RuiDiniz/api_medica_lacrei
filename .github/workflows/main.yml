name: CI - API Médica Lacrei

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: api_medica_db
          POSTGRES_USER: user_lacrei
          POSTGRES_PASSWORD: password_lacrei
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Corrigido aqui: de 'python-python' para 'python-version'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov flake8 blue bleach

      - name: Run Tests and Coverage
        env:
          DB_NAME: api_medica_db
          DB_USER: user_lacrei
          DB_PASSWORD: password_lacrei
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: test_secret_key
        run: |
          pytest --cov=users --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # Opcional: Recomendado para repositórios privados
          file: ./coverage.xml
          fail_ci_if_error: false